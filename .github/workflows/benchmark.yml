name: benchmark

# Scheduled runs use an explicit free-baseline allowlist; manual runs retain
# their route/workload selection. No pull_request trigger: a pull request must
# never start a benchmark job.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeats per route and workload (integer, 1 to 10)
        required: false
        default: '1'
        type: string
      route:
        description: One enabled route id (empty selects the free GitHub baseline)
        required: false
        default: ''
        type: string
      cache:
        description: 'Cache mode: cold (no cache, fresh VM) or warm (a priming job saves the dependency cache, the measured jobs restore it). Warm needs a route with a recorded cache backend.'
        required: false
        default: cold
        type: choice
        options:
          - cold
          - warm
      workload:
        description: One workload (required for paid pilots)
        required: false
        default: all
        type: choice
        options:
          - all
          - node-typescript
          - rust-analyzer

permissions: {}

# Keep collection/publishing serialized; never cancel an attempt to improve statistics.
concurrency:
  group: benchmark-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name != 'schedule' || (github.repository == 'ci-router/benchmark' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.run_attempt == 1) }}
    name: plan
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      prime: ${{ steps.matrix.outputs.prime }}
      hasPrime: ${{ steps.matrix.outputs.hasPrime }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: validate benchmark scripts
        run: node --test bench/*.test.mjs
      - name: matrix
        id: matrix
        env:
          REPEATS: ${{ inputs.repeats || '1' }}
          ROUTE: ${{ inputs.route }}
          WORKLOAD: ${{ inputs.workload }}
          CACHE_MODE: ${{ inputs.cache }}
          BENCHMARK_EVENT: ${{ github.event_name }}
        run: node bench/plan.mjs

  # Warm mode only: one job per route and workload fills the route's cache
  # backend. Cold runs skip it. The measured jobs restore what it saved.
  prime:
    if: ${{ needs.plan.outputs.hasPrime == 'true' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    name: prime ${{ matrix.route.id }} ${{ matrix.workload }}
    needs: plan
    runs-on: ${{ matrix.route.runsOn }}
    timeout-minutes: 30
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.prime) }}
    env:
      WORKLOAD: ${{ matrix.workload }}
      BENCH_CACHE_MODE: warm
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        run: bash "workloads/${WORKLOAD}/setup.sh"
      - name: prime
        run: |
          if [ -f "workloads/${WORKLOAD}/prime.sh" ]; then bash "workloads/${WORKLOAD}/prime.sh"; fi
      - name: cache paths
        id: paths
        run: bash bench/cache-paths.sh "$WORKLOAD"
      - name: save cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.paths }}
          key: bench-${{ github.run_id }}-${{ matrix.route.id }}-${{ matrix.workload }}

  run:
    # Paid jobs run only from main and only on the first attempt: a re-run of a
    # paid dispatch would be a retry, and a branch dispatch's result is never collected.
    # A cold run has no priming job (skipped); a failed priming job stops the warm runs.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.prime.result == 'success' || needs.prime.result == 'skipped') && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    name: run ${{ matrix.route.id }} ${{ matrix.workload }} ${{ matrix.rep }}${{ matrix.mode == 'warm' && ' warm' || '' }}
    needs: [plan, prime]
    runs-on: ${{ matrix.route.runsOn }}
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WORKLOAD: ${{ matrix.workload }}
      BENCH_CACHE_MODE: ${{ matrix.mode }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fingerprint
        run: bash bench/fingerprint.sh > fingerprint.json
      - name: cache paths
        if: ${{ matrix.mode == 'warm' }}
        id: paths
        run: bash bench/cache-paths.sh "$WORKLOAD"
      # Timed on its own: collect reads this step's duration as restoreSeconds.
      # An exact key and a failure on a miss: a missing cache is a failed job,
      # never a silent cold run recorded as warm.
      - name: restore cache
        if: ${{ matrix.mode == 'warm' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.paths }}
          key: bench-${{ github.run_id }}-${{ matrix.route.id }}-${{ matrix.workload }}
          fail-on-cache-miss: true
      - name: measure restore
        if: ${{ matrix.mode == 'warm' }}
        run: bash bench/cache-size.sh "$WORKLOAD" cache.json
      - name: setup
        run: bash "workloads/${WORKLOAD}/setup.sh"
      - name: work
        run: bash "workloads/${WORKLOAD}/work.sh"
      - name: upload fingerprint
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-${{ github.run_attempt }}-${{ matrix.route.id }}-${{ matrix.workload }}-${{ matrix.rep }}${{ matrix.mode == 'warm' && '-warm' || '' }}
          path: |
            fingerprint.json
            cache.json
          if-no-files-found: ignore
          retention-days: 90

  collect:
    name: collect
    needs: [plan, run]
    if: ${{ always() && needs.plan.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || github.run_attempt == 1) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: download fingerprints
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fingerprint-${{ github.run_attempt }}-*
          path: artifacts
      - name: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node bench/collect.mjs --artifacts artifacts --out out
      # Raw copies of what GitHub deletes. A failure here warns and does not
      # stop the rows from publishing.
      - name: archive raw data
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node bench/archive.mjs --out out || echo "::warning::raw data was not archived; see the log above"
      - name: publish to the results branch
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash bench/publish.sh out
